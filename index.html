
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فیلتر بمب LBank Spot</title>
<style>
body{font-family:Arial,sans-serif;background:#101522;color:#f4f6fb;margin:0;padding:15px}
main{max-width:950px;margin:auto}
h2{color:#ffd166}
.panel{background:#1b2435;border:1px solid #303d53;border-radius:12px;padding:14px;margin:12px 0}
button{padding:13px 17px;border:0;border-radius:9px;background:#ffd166;color:#171717;font-weight:bold;margin:4px}
button:disabled{opacity:.5}
.secondary{background:#35445d;color:white}
.small{font-size:13px;color:#bdc8da;line-height:1.9}
#status{white-space:pre-wrap;line-height:1.9;overflow-wrap:anywhere}
#results{overflow-x:auto}
table{width:100%;min-width:700px;border-collapse:collapse;font-size:13px}
td,th{text-align:right;vertical-align:top;padding:9px;border-bottom:1px solid #3b465b;line-height:1.8}
th{color:#ffd166}
</style>
</head>
<body>
<main>
<h2>💣 فیلتر بمب — تمام LBank Spot</h2>

<div class="panel small">
بازار: همه جفت‌های USDT قابل‌دریافت از LBank Spot<br>
مارکت‌کپ: بدون محدودیت<br>
تغییر ۲۴ ساعته: از ‎-۲۰٪ تا ‎+۲۰٪<br>
تایم‌فریم: یک‌ساعته (1H)<br>
امتیاز نهایی: حداقل ۷٫۵ از ۱۰<br>
حداکثر خروجی: ۵ ارز برتر
</div>

<button id="start" onclick="startScan()">شروع اسکن کامل</button>
<button class="secondary" onclick="stopScan()">توقف</button>

<div class="panel">
<b>گزارش اسکن</b>
<div id="status">آماده شروع.</div>
</div>

<div class="panel">
<b>نامزدهای فیلتر بمب</b>
<div id="results" class="small">هنوز اسکن اجرا نشده است.</div>
</div>

<script>
const $=id=>document.getElementById(id);
let stopped=false;

const API="https://api.lbkex.com/v2";

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function stopScan(){
  stopped=true;
  $("status").textContent+="\nدرخواست توقف ثبت شد.";
}

function fmt(n,d=2){
  return Number(n).toLocaleString("en-US",{maximumFractionDigits:d});
}

async function getJSON(url){
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  if(j.result===false || j.result==="false"){
    throw new Error(j.msg||("خطای API: "+j.error_code));
  }
  return j;
}

function getRows(j){
  if(Array.isArray(j.data)) return j.data;
  if(Array.isArray(j.result)) return j.result;
  return null;
}

async function getPairs(){
  const j=await getJSON(API+"/currencyPairs.do");
  const rows=getRows(j);
  if(!rows) throw new Error("فهرست جفت‌ارزها قابل شناسایی نیست.");

  return [...new Set(rows.map(x=>
    String(typeof x==="string"?x:x.symbol||"").toLowerCase()
  ))].filter(s=>s.endsWith("_usdt"));
}

async function getTickers(){
  const j=await getJSON(API+"/ticker/24hr.do?symbol=all");
  const rows=getRows(j);
  if(!rows) throw new Error("قالب پاسخ تیکر قابل شناسایی نیست.");

  const map=new Map();
  for(const row of rows){
    const pair=String(row.symbol||"").toLowerCase();
    if(!pair.endsWith("_usdt")) continue;

    const t=row.ticker||row;
    const change=Number(t.change);
    const price=Number(t.latest??t.price);
    const volume=Number(t.vol??t.volume);
    const turnover=Number(t.turnover);

    map.set(pair,{
      pair,
      change,
      price,
      volume:Number.isFinite(volume)?volume:0,
      turnover:Number.isFinite(turnover)?turnover:0
    });
  }
  return map;
}

async function getCandles(pair){
  const url=API+"/kline.do?symbol="+encodeURIComponent(pair)+
    "&type=hour1&size=60&time="+Math.floor(Date.now()/1000);

  const j=await getJSON(url);
  const rows=getRows(j);
  if(!rows||rows.length<25) throw new Error("کندل کافی نیست");

  const out=rows.map(x=>{
    if(!Array.isArray(x)) return null;
    return {
      time:Number(x[0]),
      open:Number(x[1]),
      high:Number(x[2]),
      low:Number(x[3]),
      close:Number(x[4]),
      volume:Number(x[5])
    };
  }).filter(x=>x&&x.close>0&&
    Number.isFinite(x.high)&&Number.isFinite(x.low)&&
    Number.isFinite(x.volume));

  if(out.length<25) throw new Error("داده کندل ناقص است");
  out.sort((a,b)=>a.time-b.time);
  return out;
}

function analyze(rows){
  const closes=rows.map(x=>x.close);
  const last=closes.at(-1);
  const recent=rows.slice(-6);
  const previous=rows.slice(-24,-6);

  const rv=recent.reduce((s,x)=>s+x.volume,0)/recent.length;
  const pv=previous.reduce((s,x)=>s+x.volume,0)/
    Math.max(1,previous.length);
  const volumeRatio=pv>0?rv/pv:0;

  const move6=(last/closes[closes.length-7]-1)*100;
  const move24=(last/closes[closes.length-24]-1)*100;
  const last24=rows.slice(-24);
  const high=Math.max(...last24.map(x=>x.high));
  const low=Math.min(...last24.map(x=>x.low));
  const range=(high-low)/last*100;

  const lows=rows.slice(-6).map(x=>x.low);
  let higher=0;
  for(let i=1;i<lows.length;i++){
    if(lows[i]>lows[i-1]) higher++;
  }

  let score=0;
  const evidence=[];

  if(volumeRatio>=2){
    score+=2;
    evidence.push("حجم ۶ ساعت اخیر ≥۲ برابر میانگین ۱۸ ساعت قبل");
  }else if(volumeRatio>=1.4){
    score+=1;
    evidence.push("افزایش نسبی حجم");
  }else{
    evidence.push("جهش حجم تأیید نشده");
  }

  if(Math.abs(move6)<=3){
    score+=2;
    evidence.push("حرکت ۶ ساعته محدود");
  }else if(Math.abs(move6)<=5){
    score+=1;
    evidence.push("حرکت نسبتاً محدود در ۶ ساعت");
  }

  if(range<=8){
    score+=2;
    evidence.push("دامنه ۲۴ کندل فشرده");
  }else if(range<=13){
    score+=1;
    evidence.push("فشردگی نسبی دامنه");
  }

  if(higher>=4){
    score+=2;
    evidence.push("کف‌های بالاتر");
  }else if(higher>=2){
    score+=1;
    evidence.push("چند کف بالاتر");
  }

  if(high>last&&(high-last)/last*100<=2.5){
    score+=1;
    evidence.push("نزدیک سقف کوتاه‌مدت");
  }

  if(move24>=-3&&move24<=5){
    score+=1;
    evidence.push("حرکت ۲۴ کندل هنوز محدود");
  }

  const risks=[];
  if(volumeRatio<1.4) risks.push("حجم غیرعادی تأیید نشده");
  if(Math.abs(move6)>5) risks.push("حرکت اخیر قیمت زیاد است");
  if(range>13) risks.push("دامنه نوسان وسیع");
  if(!risks.length) risks.push("شکست الگو و نوسان شدید ممکن است");

  return {
    score:Math.min(10,score),
    volumeRatio,
    move6,
    move24,
    range,
    evidence,
    risk:risks.join("؛ ")
  };
}

async function startScan(){
  stopped=false;
  $("start").disabled=true;
  $("results").textContent="در حال آماده‌سازی…";

  let pairs=[],tickers;
  let pairCount=0,eligible=0,checked=0,errors=0,missing=0;
  let errorExamples=[];
  const candidates=[];

  try{
    $("status").textContent="مرحله ۱: دریافت تمام جفت‌های Spot USDT…";
    pairs=await getPairs();
    pairCount=pairs.length;

    $("status").textContent+="\nمرحله ۲: دریافت تیکرهای بازار…";
    tickers=await getTickers();

    const scanPairs=pairs.filter(p=>tickers.has(p));

    $("status").textContent=
      "جفت‌های USDT در فهرست بازار: "+pairCount+
      "\nجفت‌های دارای تیکر: "+scanPairs.length+
      "\nدر حال بررسی تغییر روزانه و نمودار 1H…";

    const eligiblePairs=[];

    for(const pair of scanPairs){
      const t=tickers.get(pair);
      if(!Number.isFinite(t.change)) continue;
      if(t.change < -20 || t.change > 20) continue;
      eligible++;
      eligiblePairs.push({pair,t});
    }

    for(let i=0;i<eligiblePairs.length;i++){
      if(stopped) break;

      const {pair,t}=eligiblePairs[i];
      try{
        const candles=await getCandles(pair);
        checked++;
        const a=analyze(candles);

        if(a.score>=7.5){
          candidates.push({...t,...a});
        }
      }catch(e){
        errors++;
        if(errorExamples.length<5) errorExamples.push(pair+": "+e.message);
      }

      $("status").textContent=
        "جفت‌های USDT در فهرست بازار: "+pairCount+
        "\nدارای تیکر: "+scanPairs.length+
        "\nتغییر ۲۴ ساعته در محدوده: "+eligible+
        "\nکندل‌های 1H بررسی‌شده: "+checked+
        "\nخطای نمودار: "+errors+
        "\nپیشرفت: "+(i+1)+" از "+eligiblePairs.length+
        (stopped?"\nتوقف درخواست شده.":"\nدر حال اسکن…");

      await sleep(160);
    }

    candidates.sort((a,b)=>b.score-a.score);
    const top=candidates.slice(0,5);

    if(!top.length){
      $("results").textContent=
        "نامزدی با امتیاز حداقل ۷٫۵ پیدا نشد."+
        (errors?"\nتوجه: خطای نمودار وجود دارد؛ ممکن است اسکن ناقص باشد.":"");
    }else{
      let html="<table><thead><tr>"+
        "<th>جفت‌ارز</th><th>قیمت</th><th>تغییر ۲۴س</th>"+
        "<th>حجم ۲۴س</th><th>امتیاز</th><th>شواهد 1H</th><th>ریسک</th>"+
        "</tr></thead><tbody>";

      for(const x of top){
        html+="<tr><td><b>"+x.pair.toUpperCase()+"</b></td>"+
          "<td>"+(Number.isFinite(x.price)?fmt(x.price,8):"نامشخص")+"</td>"+
          "<td>"+x.change.toFixed(2)+"%</td>"+
          "<td>"+fmt(x.turnover||x.volume)+"</td>"+
          "<td><b>"+x.score.toFixed(1)+"/10</b></td>"+
          "<td>"+x.evidence.join("؛ ")+"</td>"+
          "<td>"+x.risk+"</td></tr>";
      }

      html+="</tbody></table>";
      $("results").innerHTML=html;
    }

    $("status").textContent=
      "اسکن "+(stopped?"متوقف شد":"پایان یافت")+
      "\nجفت‌های Spot USDT در فهرست بازار: "+pairCount+
      "\nجفت‌های دارای تیکر: "+tickers.size+
      "\nواجد شرایط تغییر ۲۴ ساعته: "+eligible+
      "\nکندل 1H بررسی‌شده: "+checked+
      "\nخطای کندل: "+errors+
      "\nنامزدهای دارای امتیاز ≥۷٫۵: "+candidates.length+
      "\nنتایج نمایش‌داده‌شده: "+top.length+
      (errorExamples.length?"\n\nنمونه خطاها:\n- "+errorExamples.join("\n- "):"")+
      "\n\nمارکت‌کپ هیچ محدودیتی ندارد.";

  }catch(e){
    $("status").textContent=
      "خطای اسکن: "+e.message+
      "\nاطلاعات بازار دریافت نشد؛ نتیجه قابل اتکا نیست.";
    $("results").textContent="اسکن کامل نشد.";
  }finally{
    $("start").disabled=false;
  }
}
</script>
</main>
</body>
</html>
