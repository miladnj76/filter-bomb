
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسکنر فیلتر بمب LBank</title>
<style>
body{font-family:Arial,sans-serif;background:#10151e;color:#f2f5f9;margin:0;padding:16px}
main{max-width:850px;margin:auto}
h2{color:#ffd166}
button{background:#ffd166;color:#151515;border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
.panel{background:#1b2431;border-radius:12px;padding:14px;margin:12px 0;overflow-wrap:anywhere}
.small{color:#b8c3d1;font-size:13px;line-height:1.8}
#status{white-space:pre-wrap;line-height:1.9}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 5px;border-bottom:1px solid #354052;text-align:right}
th{color:#ffd166}
.good{color:#74e0a3}.bad{color:#ff8989}
</style>
</head>
<body>
<main>
<h2>💣 اسکنر فیلتر بمب</h2>
<div class="panel">
  <div class="small">
    بازار: LBank Spot / USDT<br>
    تایم‌فریم: یک‌ساعته<br>
    حداقل امتیاز: ۷٫۵ از ۱۰<br>
    حداکثر نمایش: ۵ ارز<br>
    شرط مارکت‌کپ و تغییر ۲۴ساعته: ندارد
  </div>
  <p><button id="start">شروع اسکن</button></p>
  <div id="status">برای شروع، دکمه را بزن.</div>
</div>
<div class="panel">
  <b>گزارش اتصال</b>
  <div id="report" class="small">هنوز درخواستی ارسال نشده است.</div>
</div>
<div class="panel">
  <b>نتایج اسکن</b>
  <div id="results" class="small">هنوز اسکن انجام نشده است.</div>
</div>
</main>
<script>
"use strict";

const BASES = [
  "https://api.lbkex.com/v2",
  "https://api.lbank.info/v2"
];

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

let busy = false;
let errors = [];
let checked = 0;
let candleRequests = 0;

function logError(s) {
  errors.push(s);
  if (errors.length > 8) errors.shift();
}

async function getJSON(path, timeoutMs = 12000) {
  let lastError = "خطای نامشخص";

  for (const base of BASES) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);

    try {
      const response = await fetch(base + path, {
        method: "GET",
        headers: { "Accept": "application/json" },
        signal: controller.signal,
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const json = await response.json();

      if (json && json.result === false) {
        throw new Error(json.msg || json.error_code || "پاسخ ناموفق API");
      }

      if (json && json.error_code && Number(json.error_code) !== 0) {
        throw new Error(json.msg || "API error " + json.error_code);
      }

      return { json, base };
    } catch (e) {
      lastError = e.name === "AbortError"
        ? "مهلت اتصال تمام شد"
        : (e.message || "Load failed");
    } finally {
      clearTimeout(timer);
    }
  }

  throw new Error(lastError);
}

function extractData(json) {
  if (Array.isArray(json)) return json;
  if (json && Array.isArray(json.data)) return json.data;
  throw new Error("قالب پاسخ API شناخته نشد");
}

function number(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : NaN;
}

function pairName(item) {
  if (typeof item === "string") return item.toLowerCase();
  if (item && typeof item.symbol === "string") {
    return item.symbol.toLowerCase();
  }
  return "";
}

async function getPairs() {
  const { json } = await getJSON("/currencyPairs.do");
  return extractData(json)
    .map(pairName)
    .filter(p => /^[a-z0-9]+_usdt$/.test(p));
}

async function getTickers() {
  const { json } = await getJSON("/ticker/24hr.do?symbol=all");
  const rows = extractData(json);
  const map = new Map();

  for (const item of rows) {
    if (!item || !item.symbol) continue;
    const t = item.ticker || item;
    map.set(String(item.symbol).toLowerCase(), {
      price: number(t.latest ?? t.last),
      volume24h: number(t.vol),
      turnover: number(t.turnover)
    });
  }

  return map;
}

async function getCandles(symbol) {
  const now = Math.floor(Date.now() / 1000);
  const path = "/kline.do?symbol=" + encodeURIComponent(symbol) +
    "&type=hour1&size=60&time=" + now;
  const { json } = await getJSON(path, 10000);
  const rows = extractData(json);

  const candles = rows.map(r => {
    if (Array.isArray(r)) {
      return {
        time: number(r[0]),
        open: number(r[1]),
        high: number(r[2]),
        low: number(r[3]),
        close: number(r[4]),
        volume: number(r[5])
      };
    }
    return {
      time: number(r.time ?? r.timestamp),
      open: number(r.open),
      high: number(r.high),
      low: number(r.low),
      close: number(r.close),
      volume: number(r.volume ?? r.vol)
    };
  }).filter(c =>
    Number.isFinite(c.close) && c.close > 0 &&
    Number.isFinite(c.high) && Number.isFinite(c.low) &&
    Number.isFinite(c.volume) && c.volume >= 0
  );

  candles.sort((a,b) => a.time - b.time);
  if (candles.length < 24) {
    throw new Error("کمتر از ۲۴ کندل معتبر");
  }
  return candles;
}

function scoreCandles(c) {
  const n = c.length;
  const last = c[n-1].close;
  let score = 0;
  const evidence = [];

  const recentVol = c.slice(-6).reduce((s,x)=>s+x.volume,0)/6;
  const priorVol = c.slice(-24,-6).reduce((s,x)=>s+x.volume,0)/18;
  const volumeRatio = priorVol > 0 ? recentVol/priorVol : 0;

  if (volumeRatio >= 2) {
    score += 2;
    evidence.push("حجم ۶ ساعت اخیر " + volumeRatio.toFixed(2) + " برابر میانگین قبلی");
  } else if (volumeRatio >= 1.4) {
    score += 1;
    evidence.push("افزایش نسبی حجم " + volumeRatio.toFixed(2) + " برابر");
  }

  const price6 = c[n-7].close;
  const change6 = (last/price6-1)*100;
  if (Math.abs(change6) <= 3) {
    score += 2;
    evidence.push("قیمت در ۶ ساعت تقریباً فشرده است");
  } else if (Math.abs(change6) <= 5) {
    score += 1;
    evidence.push("تغییر قیمت ۶ ساعته " + change6.toFixed(2) + "%");
  }

  const recent = c.slice(-24);
  const hi = Math.max(...recent.map(x=>x.high));
  const lo = Math.min(...recent.map(x=>x.low));
  const range = lo > 0 ? (hi-lo)/lo*100 : 999;

  if (range <= 8) {
    score += 2;
    evidence.push("دامنه نوسان ۲۴ کندل " + range.toFixed(2) + "%؛ فشردگی بالا");
  } else if (range <= 13) {
    score += 1;
    evidence.push("دامنه نوسان ۲۴ کندل " + range.toFixed(2) + "%");
  }

  let higherLows = 0;
  for (let i=n-6; i<n-1; i++) {
    if (c[i].low > c[i-1].low) higherLows++;
  }
  if (higherLows >= 4) {
    score += 2;
    evidence.push("کف‌های بالاتر در " + higherLows + " مقایسه");
  } else if (higherLows >= 2) {
    score += 1;
    evidence.push("چند کف بالاتر تشکیل شده");
  }

  const distanceHigh = hi > 0 ? (hi-last)/hi*100 : 999;
  if (distanceHigh <= 2.5) {
    score += 1;
    evidence.push("قیمت نزدیک سقف کوتاه‌مدت است");
  }

  const change24 = (last/c[0 + n-24].close-1)*100;
  if (change24 >= -3 && change24 <= 5) {
    score += 1;
    evidence.push("حرکت ۲۴ کندلی بین ۳%- و ۵%+ است");
  }

  return {
    score: Math.min(10, score),
    price: last,
    volumeRatio,
    change6,
    range,
    evidence,
    risk: volumeRatio < 1.4
      ? "جهش حجم تأیید نشده"
      : "امتیاز فقط الگوی قیمتی است؛ تضمین رشد نیست"
  };
}

async function runPool(items, limit, worker) {
  let index = 0;
  const workers = Array.from(
    {length: Math.min(limit, items.length)},
    async () => {
      while (index < items.length) {
        const i = index++;
        await worker(items[i]);
      }
    }
  );
  await Promise.all(workers);
}

async function scan() {
  if (busy) return;
  busy = true;
  $("start").disabled = true;
  $("results").textContent = "در حال دریافت اطلاعات...";
  $("report").textContent = "";
  $("status").textContent = "مرحله ۱ از ۳: دریافت جفت‌ارزها و قیمت‌ها...";
  errors = [];
  checked = 0;
  candleRequests = 0;

  try {
    const pairs = await getPairs();
    $("status").textContent =
      "مرحله ۲ از ۳: دریافت تیکر بازار؛ جفت‌ارزهای USDT در فهرست: " +
      pairs.length;

    const tickers = await getTickers();
    const candidates = pairs.filter(p => tickers.has(p));
    if (!candidates.length) {
      throw new Error("تیکرها با فهرست جفت‌ارزها تطبیق نداشتند");
    }

    const scored = [];
    $("status").textContent =
      "مرحله ۳ از ۳: بررسی کندل‌های یک‌ساعته. ممکن است چند دقیقه طول بکشد.";

    await runPool(candidates, 4, async symbol => {
      candleRequests++;
      try {
        const candles = await getCandles(symbol);
        checked++;
        const result = scoreCandles(candles);
        if (result.score >= 7.5) {
          scored.push({
            symbol,
            ...result,
            ticker: tickers.get(symbol)
          });
        }
      } catch (e) {
        logError(symbol + ": " + (e.message || "خطای دریافت کندل"));
      }
      $("status").textContent =
        "در حال بررسی کندل‌ها: " + candleRequests +
        " از " + candidates.length +
        " جفت‌ارز | کندل معتبر: " + checked;
      await sleep(80);
    });

    scored.sort((a,b)=>b.score-a.score);
    const top = scored.slice(0,5);

    if (!top.length) {
      $("results").innerHTML =
        "نامزدی با امتیاز ۷٫۵ یا بالاتر پیدا نشد. " +
        "این به معنی نبود فرصت نیست؛ فقط با این معیارها نامزدی تأیید نشد.";
    } else {
      $("results").innerHTML =
        '<table><thead><tr><th>جفت‌ارز</th><th>قیمت</th><th>امتیاز</th><th>شواهد</th><th>ریسک</th></tr></thead><tbody>' +
        top.map(x => '<tr>' +
          '<td>' + x.symbol.toUpperCase() + '</td>' +
          '<td>' + x.price + '</td>' +
          '<td class="good">' + x.score.toFixed(1) + '/10</td>' +
          '<td>' + x.evidence.join("؛ ") + '</td>' +
          '<td>' + x.risk + '</td></tr>').join("") +
        '</tbody></table>';
    }

    $("status").textContent = "اسکن پایان یافت.";
    $("report").textContent =
      "جفت‌ارزهای Spot/USDT در فهرست: " + pairs.length +
      "\nجفت‌ارزهای دارای تیکر: " + candidates.length +
      "\nدرخواست کندل ارسال‌شده: " + candleRequests +
      "\nجفت‌ارزهای دارای کندل معتبر: " + checked +
      "\nخطاهای ثبت‌شده: " + errors.length +
      (errors.length ? "\nنمونه خطاها:\n" + errors.slice(0,8).join("\n") : "");

  } catch (e) {
    $("status").innerHTML =
      '<span class="bad">خطای اسکن: ' +
      (e.message || "Load failed") +
      '</span>\nاطلاعات بازار دریافت نشد؛ نتیجه قابل اتکا نیست.';
    $("report").textContent =
      "درخواست‌های کندل موفق: " + checked +
      "\nخطاها:\n" + errors.slice(0,8).join("\n");
    $("results").textContent = "نتیجه‌ای برای نمایش تأیید نشد.";
  } finally {
    busy = false;
    $("start").disabled = false;
  }
}

$("start").addEventListener("click", scan);
</script>
</body>
</html>
